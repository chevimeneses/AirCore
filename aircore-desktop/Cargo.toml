[package]
name = "aircore-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
aircore-core = { path = "../aircore-core" }
eframe = "0.31"
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_WiFiDirect",
    "Devices_WiFi",
    "Devices_Enumeration",
    "Security_Credentials",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_Com",
    "Storage_Streams",
] }